<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POS – Register</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <style>
        body {
            background: #f0f2f5;
        }
    </style>
</head>

<body>
    <div>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">MY POS</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="register.html">Register</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link " href="login.html">Login</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <div id="app" class="d-flex align-items-center justify-content-center vh-100">
            <div class="card shadow p-4" style="width:100%;max-width:440px;">
                <h4 class="text-center fw-bold mb-1">POS System</h4>
                <p class="text-center text-muted mb-4">Create your account</p>

                <div v-if="errorMsg" class="alert alert-danger  py-2">{{ errorMsg }}</div>
                <div v-if="successMsg" class="alert alert-success py-2">{{ successMsg }}</div>

                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input v-model="full_name" type="text" class="form-control" placeholder="Your Name" />
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input v-model="email" type="email" class="form-control" placeholder="you@example.com" />
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input v-model="password" type="password" class="form-control" placeholder="••••••••" />
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirm Password</label>
                    <input v-model="confirmPassword" type="password" class="form-control" placeholder="••••••••"
                        @keyup.enter="register" />
                </div>

                <button class="btn btn-success w-100" @click="register" :disabled="loading">
                    <span v-if="loading" class="spinner-border spinner-border-sm me-1"></span>
                    {{ loading ? 'Registering…' : 'Register' }}
                </button>

                <p class="text-center mt-3 mb-0">
                    Already have an account? <a href="login.html">Login</a>
                </p>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.14/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        const BASE_URL = "http://127.0.0.1:5050"

        new Vue({
            el: "#app",
            data: {
                full_name: "",
                email: "",
                password: "",
                confirmPassword: "",
                errorMsg: "",
                successMsg: "",
                loading: false
            },
            methods: {
                async register() {
                    this.errorMsg = ""
                    this.successMsg = ""

                    if (this.full_name === "" || this.email === "" || this.password === "" || this.confirmPassword === "") {
                        this.errorMsg = "All fields are required"
                        return
                    }

                    if (this.password !== this.confirmPassword) {
                        this.errorMsg = "Passwords do not match"
                        return
                    }

                    this.loading = true
                    try {
                        const res = await axios.post(`${BASE_URL}/register`, {
                            full_name: this.full_name,
                            email: this.email,
                            password: this.password
                        })
                        localStorage.setItem("token", res.data.token)
                        this.successMsg = "Registered successfully! Redirecting…"
                        setTimeout(() => window.location.href = "products.html", 1000)
                    } catch (err) {
                        this.errorMsg = err.response?.data?.msg || "Registration failed"
                    } finally {
                        this.loading = false
                    }
                }
            }
        })
    </script>
</body>

</html>
