<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POS – Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <style>
        body {
            background: #f0f2f5;
        }
    </style>
</head>

<body>
    <div>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">MY POS</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link " aria-current="page" href="register.html">Register</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="login.html">Login</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <div id="app" class="d-flex align-items-center justify-content-center vh-100">
            <div class="card shadow p-4" style="width:100%;max-width:420px;">
                <h4 class="text-center fw-bold mb-1">POS System</h4>
                <p class="text-center text-muted mb-4">Sign in to your account</p>

                <div v-if="errorMsg" class="alert alert-danger py-2">{{ errorMsg }}</div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input v-model="email" type="email" class="form-control" placeholder="you@example.com" />
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input v-model="password" type="password" class="form-control" placeholder="••••••••"
                        @keyup.enter="login" />
                </div>

                <button class="btn btn-primary w-100" @click="login" :disabled="loading">
                    <span v-if="loading" class="spinner-border spinner-border-sm me-1"></span>
                    {{ loading ? 'Signing in…' : 'Login' }}
                </button>

                <p class="text-center mt-3 mb-0">
                    Don't have an account? <a href="register.html">Register</a>
                </p>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.14/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        const BASE_URL = "http://127.0.0.1:5000"

        new Vue({
            el: "#app",
            data: {
                email: "",
                password: "",
                errorMsg: "",
                loading: false
            },
            methods: {
                async login() {
                    this.errorMsg = ""

                    if (this.email === "" || this.password === "") {
                        this.errorMsg = "Email and password are required"
                        return
                    }

                    this.loading = true
                    try {
                        const res = await axios.post(`${BASE_URL}/login`, {
                            email: this.email,
                            password: this.password
                        })
                        localStorage.setItem("token", res.data.token)
                        localStorage.setItem("user", JSON.stringify(res.data.user))
                        window.location.href = "products.html"
                    } catch (err) {
                        this.errorMsg = err.response?.data?.msg || "Login failed"
                    } finally {
                        this.loading = false
                    }
                }
            }
        })
    </script>
</body>

</html>
